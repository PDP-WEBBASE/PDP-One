name: Issue 43 source integration

on:
  push:
    branches:
      - feature/full-pending-procurement-analysis-issue-43
    paths:
      - .github/workflows/issue-43-source-patches.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-pending-procurement-analysis-issue-43
          fetch-depth: 0
      - name: Apply focused source patches
        run: python scripts/apply_issue43_source_patches.py
      - name: Remove one-time integration files
        run: |
          rm -f scripts/apply_issue43_source_patches.py
          rm -f .github/workflows/issue-43-source-patches.yml
      - name: Commit integrated source
        run: |
          git config user.name "PDP One Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate issue 43 analysis run sources"
          git push origin HEAD:feature/full-pending-procurement-analysis-issue-43
