name: Create fixed PDP One release

on:
  push:
    branches: [main]
    paths:
      - release/VERSION

permissions:
  contents: write

concurrency:
  group: pdp-one-fixed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "PDP One ${tag}" --notes-file release/release-notes.md
