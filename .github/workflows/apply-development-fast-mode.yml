name: Apply development fast mode patch

on:
  push:
    branches:
      - feature/development-fast-mode-and-opportunity-flow-20260731
    paths:
      - scripts/dev/apply_development_fast_mode.py
      - .github/workflows/apply-development-fast-mode.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[fast-mode-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/development-fast-mode-and-opportunity-flow-20260731
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/dev/apply_development_fast_mode.py
      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes were required.'
            exit 0
          fi
          git config user.name 'PDP One Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/windows/Deployment-Agent.ps1 scripts/windows/Invoke-PDPOneDeployment.ps1 scripts/windows/Update-PDPOne.ps1 services/pdp_mcp/server.py
          git commit -m '[fast-mode-applied] Add temporary development change-management mode'
          git push origin HEAD:feature/development-fast-mode-and-opportunity-flow-20260731
