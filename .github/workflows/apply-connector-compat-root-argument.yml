name: Apply connector compatibility root argument

on:
  push:
    branches:
      - feature/connector-acceptance-agent-20260725
    paths:
      - tools/apply_connector_compat_root_argument.py
      - .github/workflows/apply-connector-compat-root-argument.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/connector-acceptance-agent-20260725
          fetch-depth: 0

      - name: Apply exact argument fix
        run: python tools/apply_connector_compat_root_argument.py

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Pass project root through cached connector bridge"
          git push origin HEAD:feature/connector-acceptance-agent-20260725
