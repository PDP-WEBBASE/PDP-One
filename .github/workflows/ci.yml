name: PDP One CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify Python syntax and migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: |
          python -m compileall -q backend services/pdp_mcp
          python backend/manage.py makemigrations --check --dry-run
      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python backend/manage.py test core.tests -v 2
