name: PDP One CI

on:
  pull_request:

permissions:
  contents: read

# The protected main branch accepts changes through up-to-date PRs. CI therefore
# validates the exact PR head and does not repeat the same suite after merge.
# Newer commits on the same PR cancel superseded runs.
concurrency:
  group: pdp-one-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify PR change scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/pdp-changed-files.txt
          echo "Changed files:"
          cat /tmp/pdp-changed-files.txt

          run_node=false
          run_backend=false
          run_windows_helpers=false
          run_preview=false
          run_connector_packages=false

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              docs/*|*.md)
                ;;
              *)
                run_node=true
                ;;
            esac

            case "$path" in
              backend/*|services/pdp_mcp/*|docker-compose.yml|.github/workflows/ci.yml)
                run_backend=true
                ;;
            esac

            case "$path" in
              scripts/windows/*|*.bat|docker-compose.yml|HOST-RUNTIME-SOURCE|.github/workflows/ci.yml)
                run_windows_helpers=true
                ;;
            esac

            case "$path" in
              app/*|components/*|lib/*|public/*|styles/*|package.json|package-lock.json|tsconfig.json|eslint.config.*|vinext.config.*|next.config.*|infra/docker/web.Dockerfile|scripts/build-verified.sh|scripts/sites-env.sh)
                run_preview=true
                ;;
            esac

            case "$path" in
              backend/procurement/*)
                run_connector_packages=true
                ;;
            esac
          done < /tmp/pdp-changed-files.txt

          {
            echo "RUN_NODE=$run_node"
            echo "RUN_BACKEND=$run_backend"
            echo "RUN_WINDOWS_HELPERS=$run_windows_helpers"
            echo "RUN_PREVIEW=$run_preview"
            echo "RUN_CONNECTOR_PACKAGES=$run_connector_packages"
          } >> "$GITHUB_ENV"

          printf 'scope node=%s backend=%s windows_helpers=%s preview=%s connector_packages=%s\n' \
            "$run_node" "$run_backend" "$run_windows_helpers" "$run_preview" "$run_connector_packages"

      - name: Reject secrets and destructive volume operations
        shell: bash
        run: |
          set -euo pipefail
          command -v grep >/dev/null 2>&1 || {
            echo 'Required grep command is unavailable; refusing to skip security scans.' >&2
            exit 2
          }
          if grep -R -nE --exclude-dir=.git --exclude=package-lock.json '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|tskey-[A-Za-z0-9_-]{20,})' .; then
            echo 'A value resembling a secret was found.' >&2
            exit 1
          fi
          if grep -R -nE '(docker[[:space:]]+compose[[:space:]]+down[[:space:]]+-v|docker[[:space:]]+volume[[:space:]]+rm|docker[[:space:]]+system[[:space:]]+prune.*--volumes)' scripts/windows ./*.bat docker-compose.yml; then
            echo 'A forbidden destructive volume operation was found.' >&2
            exit 1
          fi

      - name: Parse Windows PowerShell scripts
        if: env.RUN_WINDOWS_HELPERS == 'true'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Test portable recovery and Windows compatibility helpers
        if: env.RUN_WINDOWS_HELPERS == 'true'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/windows/tests/Test-PortableRecovery.ps1

      - uses: actions/setup-node@v4
        if: env.RUN_NODE == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        if: env.RUN_NODE == 'true'
        run: npm ci

      - name: Run frontend lint
        id: frontend_lint
        if: env.RUN_NODE == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Upload failed frontend lint log
        if: steps.frontend_lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-frontend-lint-log-${{ github.event.pull_request.head.sha }}
          path: frontend-lint.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run Node contract and frontend tests
        if: env.RUN_NODE == 'true'
        run: npm test

      - name: Add procurement preview manifest
        if: env.RUN_PREVIEW == 'true' && success()
        shell: bash
        run: |
          mkdir -p dist/.pdpone-preview
          cat > dist/.pdpone-preview/manifest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${{ github.event.pull_request.head.sha }}",
            "pull_request": ${{ github.event.pull_request.number }},
            "preview_route": "/procurement",
            "production_changed": false,
            "database_migrated": false,
            "deployment_authorized": false
          }
          EOF

      - name: Upload procurement preview artifact
        if: env.RUN_PREVIEW == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-procurement-preview-${{ github.event.pull_request.head.sha }}
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - uses: actions/setup-python@v5
        if: env.RUN_BACKEND == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        if: env.RUN_BACKEND == 'true'
        run: pip install -r backend/requirements.txt

      - name: Verify Python syntax and migrations
        id: python_verify
        if: env.RUN_BACKEND == 'true'
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q backend services/pdp_mcp 2>&1 | tee python-compile.log
          python backend/manage.py makemigrations --check --dry-run 2>&1 | tee migration-check.log

      - name: Upload failed Python and migration logs
        if: steps.python_verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-python-migration-log-${{ github.event.pull_request.head.sha }}
          path: |
            python-compile.log
            migration-check.log
          if-no-files-found: warn
          retention-days: 3

      - name: Test signed deployment queue
        if: env.RUN_BACKEND == 'true'
        env:
          PYTHONPATH: services/pdp_mcp
        run: python -m unittest services.pdp_mcp.test_deployment_queue -v

      - name: Run backend tests
        id: backend_tests
        if: env.RUN_BACKEND == 'true'
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        shell: bash
        run: |
          set -o pipefail
          python backend/manage.py test core.tests procurement.tests -v 2 2>&1 | tee backend-test.log

      - name: Upload failed backend test log
        if: steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-backend-test-log-${{ github.event.pull_request.head.sha }}
          path: backend-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Build controlled SETAD live-test source package
        if: env.RUN_CONNECTOR_PACKAGES == 'true' && success()
        shell: bash
        run: |
          mkdir -p setad-live-test-package
          git archive --format=zip --output="setad-live-test-package/PDP-One-SETAD-Live-Test-Source-${{ github.event.pull_request.head.sha }}.zip" HEAD
          cat > setad-live-test-package/README-SETAD-LIVE-TEST.txt <<'EOF'
          PDP One - SETAD controlled live test

          1. Extract the source ZIP to a new folder.
          2. Start Rancher Desktop and wait for Docker to become ready.
          3. Double-click TEST-SETAD-CONNECTORS.bat.
          4. The test uses an ephemeral backend container and does not replace the running backend.
          5. A PostgreSQL backup is created before migration.
          6. Upload only the generated PDP-ONE-SETAD-LIVE-TEST-....zip report.
             Do not upload the separate database backup.
          EOF

      - name: Upload controlled SETAD live-test source package
        if: env.RUN_CONNECTOR_PACKAGES == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-setad-live-test-${{ github.event.pull_request.head.sha }}
          path: setad-live-test-package
          if-no-files-found: error
          retention-days: 3

      - name: Build Hezareh and Pars Namad live-test source package
        if: env.RUN_CONNECTOR_PACKAGES == 'true' && success()
        shell: bash
        run: |
          mkdir -p hezareh-parsnamad-live-test-package
          git archive --format=zip --output="hezareh-parsnamad-live-test-package/PDP-One-Hezareh-ParsNamad-Live-Test-Source-${{ github.event.pull_request.head.sha }}.zip" HEAD
          cat > hezareh-parsnamad-live-test-package/README-HEZAREH-PARSNAMAD-LIVE-TEST.txt <<'EOF'
          PDP One - Hezareh and Pars Namad controlled live test

          1. Extract the source ZIP to a new folder.
          2. Start Rancher Desktop and wait for Docker to become ready.
          3. Double-click TEST-HEZAREH-PARSNAMAD-CONNECTORS.bat.
          4. Four connectors are tested: tenders and inquiries for both sources.
          5. Five pages are requested for each connector; SETAD is not included.
          6. The test uses an ephemeral backend container and does not replace the running backend.
          7. A PostgreSQL backup is created before migration.
          8. Upload only the generated PDP-ONE-HEZAREH-PARSNAMAD-LIVE-TEST-....zip report.
             Do not upload the separate database backup.
          EOF

      - name: Upload Hezareh and Pars Namad live-test source package
        if: env.RUN_CONNECTOR_PACKAGES == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-hezareh-parsnamad-live-test-${{ github.event.pull_request.head.sha }}
          path: hezareh-parsnamad-live-test-package
          if-no-files-found: error
          retention-days: 3

      - name: Build Pars Namad tender repair and retest package
        if: env.RUN_CONNECTOR_PACKAGES == 'true' && success()
        shell: bash
        run: |
          mkdir -p parsnamad-tender-repair-package
          git archive --format=zip --output="parsnamad-tender-repair-package/PDP-One-ParsNamad-Tender-Repair-Source-${{ github.event.pull_request.head.sha }}.zip" HEAD
          cat > parsnamad-tender-repair-package/README-PARSNAMAD-TENDER-REPAIR.txt <<'EOF'
          PDP One - Pars Namad tender repair and five-page retest

          1. Extract the source ZIP to a new folder.
          2. Start Rancher Desktop and wait for Docker to become ready.
          3. Double-click REPAIR-RETEST-PARSNAMAD-TENDERS.bat.
          4. A PostgreSQL backup is created before any cleanup.
          5. Only new, unprotected records from the incorrect controlled test are removed.
          6. The corrected tender route is tested for five pages.
          7. Upload only the generated PDP-ONE-PARSNAMAD-TENDER-REPAIR-....zip report.
             Do not upload the separate database backup.
          EOF

      - name: Upload Pars Namad tender repair and retest package
        if: env.RUN_CONNECTOR_PACKAGES == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-parsnamad-tender-repair-${{ github.event.pull_request.head.sha }}
          path: parsnamad-tender-repair-package
          if-no-files-found: error
          retention-days: 3

  windows-powershell-51:
    name: Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Windows scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Test DPAPI and compatibility helpers
        shell: powershell
        run: .\scripts\windows\tests\Test-WindowsPowerShell51.ps1
