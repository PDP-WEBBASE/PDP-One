name: PDP One CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject secrets and destructive volume operations
        shell: bash
        run: |
          if rg -n '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|tskey-[A-Za-z0-9_-]{20,})' --glob '!package-lock.json' .; then
            echo 'A value resembling a secret was found.' >&2
            exit 1
          fi
          if rg -n '(docker\s+compose\s+down\s+-v|docker\s+volume\s+rm|docker\s+system\s+prune.*--volumes)' scripts/windows *.bat docker-compose.yml; then
            echo 'A forbidden destructive volume operation was found.' >&2
            exit 1
          fi
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Test portable recovery and Windows compatibility helpers
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/windows/tests/Test-PortableRecovery.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify Python syntax and migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        shell: bash
        run: |
          python -m compileall -q backend services/pdp_mcp
          set +e
          python backend/manage.py makemigrations --check --dry-run --verbosity 3 > migration-check.txt 2>&1
          status=$?
          cat migration-check.txt
          exit $status
      - name: Upload migration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-${{ github.run_id }}
          path: migration-check.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Test signed deployment queue
        env:
          PYTHONPATH: services/pdp_mcp
        run: python -m unittest services.pdp_mcp.test_deployment_queue -v
      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python backend/manage.py test core.tests procurement.tests -v 2

  windows-powershell-51:
    name: Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Windows scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Test DPAPI and compatibility helpers
        shell: powershell
        run: .\scripts\windows\tests\Test-WindowsPowerShell51.ps1
