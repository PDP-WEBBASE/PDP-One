name: Build immutable PDP One images

on:
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "scripts/windows/**"
      - "release/**"
      - "tests/**"

permissions:
  contents: read
  packages: write

# Only the newest head of a PR needs immutable images. Superseded heads are
# intentionally cancelled so rapid follow-up commits do not keep stale builds.
concurrency:
  group: pdp-one-images-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build-and-push:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bake keeps backend/MCP/web exact-SHA builds concurrent inside one
      # GitHub-hosted runner instead of consuming three matrix runners.
      - name: Build and push exact immutable images concurrently
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: .
          files: ./infra/docker/pdp-images-bake.hcl
          targets: default
          push: true
          provenance: false
          vars: |
            IMAGE_SHA=${{ env.IMAGE_SHA }}
            PDP_DOCKER_REGISTRY=docker.arvancloud.ir/library

      - name: Record immutable image references
        shell: bash
        run: |
          echo 'ghcr.io/pdp-webbase/pdp-one-backend:${{ env.IMAGE_SHA }}'
          echo 'ghcr.io/pdp-webbase/pdp-one-mcp:${{ env.IMAGE_SHA }}'
          echo 'ghcr.io/pdp-webbase/pdp-one-web:${{ env.IMAGE_SHA }}'
