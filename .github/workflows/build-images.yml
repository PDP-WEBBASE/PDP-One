name: Build immutable PDP One images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: pdp-one-images-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/pdp-webbase/pdp-one-backend
            build_args: |
              PDP_DOCKER_REGISTRY=docker.arvancloud.ir/library
          - name: mcp
            context: ./services/pdp_mcp
            dockerfile: ./services/pdp_mcp/Dockerfile
            image: ghcr.io/pdp-webbase/pdp-one-mcp
            build_args: |
              PDP_DOCKER_REGISTRY=docker.arvancloud.ir/library
          - name: web
            context: .
            dockerfile: ./infra/docker/web.Dockerfile
            image: ghcr.io/pdp-webbase/pdp-one-web
            build_args: |
              PDP_DOCKER_REGISTRY=docker.arvancloud.ir/library
              PDP_BUILD_ID=${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.title=PDP One ${{ matrix.name }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=pdp-one-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pdp-one-${{ matrix.name }}
          provenance: false

      - name: Record immutable image reference
        shell: bash
        run: echo '${{ matrix.image }}:${{ env.IMAGE_SHA }}'
