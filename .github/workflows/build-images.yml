name: Build immutable PDP One images

on:
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "scripts/windows/**"
      - "release/**"
      - "tests/**"

permissions:
  contents: read
  packages: write

# Only the newest head of a PR needs immutable images. Superseded heads are
# intentionally cancelled so rapid follow-up commits do not keep stale builds.
concurrency:
  group: pdp-one-images-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build-and-push:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Select one healthy source for every required base image before Bake
      # begins. This prevents a mirror outage from blocking exact GHCR images
      # and avoids retrying/pushing partially built exact-SHA tags.
      - name: Select reachable base image registry
        id: base-registry
        shell: bash
        run: |
          set -euo pipefail
          for registry in docker.arvancloud.ir/library docker.io/library; do
            echo "Checking base image registry: ${registry}"
            if timeout 20s docker buildx imagetools inspect "${registry}/python:3.13-slim" >/dev/null 2>&1 \
              && timeout 20s docker buildx imagetools inspect "${registry}/node:22-bookworm-slim" >/dev/null 2>&1; then
              echo "registry=${registry}" >> "$GITHUB_OUTPUT"
              echo "Selected base image registry: ${registry}"
              exit 0
            fi
          done
          echo "No healthy base image registry could resolve both required base images." >&2
          exit 1

      # Bake keeps backend/MCP/web exact-SHA builds concurrent inside one
      # GitHub-hosted runner instead of consuming three matrix runners.
      - name: Build and push exact immutable images concurrently
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: .
          files: ./infra/docker/pdp-images-bake.hcl
          targets: default
          push: true
          provenance: false
          vars: |
            IMAGE_SHA=${{ env.IMAGE_SHA }}
            PDP_DOCKER_REGISTRY=${{ steps.base-registry.outputs.registry }}

      - name: Record immutable image references
        shell: bash
        run: |
          echo 'ghcr.io/pdp-webbase/pdp-one-backend:${{ env.IMAGE_SHA }}'
          echo 'ghcr.io/pdp-webbase/pdp-one-mcp:${{ env.IMAGE_SHA }}'
          echo 'ghcr.io/pdp-webbase/pdp-one-web:${{ env.IMAGE_SHA }}'
