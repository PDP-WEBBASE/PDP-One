name: Issue 43 lint fix

on:
  push:
    branches:
      - feature/full-pending-procurement-analysis-issue-43
    paths:
      - .github/workflows/issue-43-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-pending-procurement-analysis-issue-43
          fetch-depth: 0
      - run: python scripts/apply_issue43_lint_fix.py
      - run: |
          rm -f scripts/apply_issue43_lint_fix.py
          rm -f .github/workflows/issue-43-lint-fix.yml
          git config user.name "PDP One Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix analysis center initial loading effect"
          git push origin HEAD:feature/full-pending-procurement-analysis-issue-43
