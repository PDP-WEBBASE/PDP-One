name: Apply connector acceptance compatibility bridge

on:
  push:
    branches:
      - feature/connector-acceptance-agent-20260725
    paths:
      - tools/apply_connector_acceptance_compat.py
      - .github/workflows/apply-connector-acceptance-compat.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/connector-acceptance-agent-20260725
          fetch-depth: 0

      - name: Apply compatibility bridge
        run: python tools/apply_connector_acceptance_compat.py

      - name: Commit patched agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add cached-client connector acceptance bridge"
          git push origin HEAD:feature/connector-acceptance-agent-20260725
