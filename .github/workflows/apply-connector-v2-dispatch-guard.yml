name: Apply connector V2 dispatch guard

on:
  push:
    branches:
      - feature/connector-real-acceptance-20260725
    paths:
      - .github/workflows/apply-connector-v2-dispatch-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connector-real-acceptance-20260725
      - name: Guard legacy dispatcher and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          task_path = Path('backend/procurement/tasks_connector_acceptance.py')
          text = task_path.read_text(encoding='utf-8')
          old = '''    if not request_payload or not request_payload.get("enabled"):\n        return {"dispatched": False, "reason": "no_enabled_request"}\n    acceptance_id = str(request_payload.get("acceptance_id", "")).strip()\n'''
          new = '''    if not request_payload or not request_payload.get("enabled"):\n        return {"dispatched": False, "reason": "no_enabled_request"}\n    if int(request_payload.get("acceptance_version", 1)) != 1:\n        return {"dispatched": False, "reason": "not_a_v1_request"}\n    acceptance_id = str(request_payload.get("acceptance_id", "")).strip()\n'''
          if old not in text:
              raise SystemExit('Legacy dispatcher insertion point not found')
          task_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('backend/procurement/tests/test_connector_acceptance.py')
          test_text = test_path.read_text(encoding='utf-8')
          if 'test_v1_dispatcher_rejects_v2_request' not in test_text:
              test_text = test_text.replace(
                  'from unittest.mock import patch\n',
                  'from unittest.mock import patch\n\nfrom unittest.mock import MagicMock\n',
                  1,
              )
              test_text = test_text.replace(
                  '    def test_compact_report_keeps_requested_acceptance_evidence(self):\n',
                  '''    def test_v1_dispatcher_rejects_v2_request(self):\n        from procurement.tasks_connector_acceptance import dispatch_connector_acceptance\n\n        with patch(\n            "procurement.tasks_connector_acceptance.recover_stale_extraction_runs",\n            return_value=[],\n        ), patch(\n            "procurement.tasks_connector_acceptance._read_json",\n            return_value={"enabled": True, "acceptance_version": 2},\n        ), patch(\n            "procurement.tasks_connector_acceptance.run_connector_acceptance.delay",\n            new=MagicMock(),\n        ) as delay:\n            result = dispatch_connector_acceptance.run()\n\n        self.assertEqual(result, {"dispatched": False, "reason": "not_a_v1_request"})\n        delay.assert_not_called()\n\n    def test_compact_report_keeps_requested_acceptance_evidence(self):\n''',
                  1,
              )
              test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/procurement/tasks_connector_acceptance.py backend/procurement/tests/test_connector_acceptance.py
          git commit -m "Guard legacy connector acceptance dispatcher from V2 requests"
          git push origin HEAD:feature/connector-real-acceptance-20260725
