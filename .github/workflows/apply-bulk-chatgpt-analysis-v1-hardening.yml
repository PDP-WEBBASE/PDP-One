name: Apply bulk ChatGPT analysis v1 hardening

on:
  push:
    branches:
      - feature/bulk-chatgpt-analysis-v1
    paths:
      - .github/workflows/apply-bulk-chatgpt-analysis-v1-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bulk-chatgpt-analysis-v1
          fetch-depth: 0

      - name: Apply hardening patch
        run: python scripts/apply_bulk_chatgpt_analysis_v1_hardening.py

      - name: Commit hardened bulk analysis implementation
        run: |
          git config user.name "PDP One Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden compact bulk analysis transport and reuse"
          git push origin HEAD:feature/bulk-chatgpt-analysis-v1
