name: Frontend Test Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-test-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run frontend test with full log
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log
      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-one-frontend-test-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend-test.log
          if-no-files-found: warn
          retention-days: 2
