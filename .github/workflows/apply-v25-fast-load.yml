name: Apply V25 fast initial load

on:
  push:
    branches:
      - perf/procurement-fast-initial-load-v25-20260725
    paths:
      - scripts/dev/apply_v25_fast_initial_load.py
      - .github/workflows/apply-v25-fast-load.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/procurement-fast-initial-load-v25-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/dev/apply_v25_fast_initial_load.py
      - name: Validate changed files
        run: |
          git diff --check
          grep -q 'if (!hasLoadedOnce.current) setMode("loading")' app/procurement/ProcurementWorkspaceV13.tsx
          grep -q 'managementLoadVersion.current === refresh' app/procurement/ProcurementWorkspaceV13.tsx
          grep -q 'procurement-fast-initial-v25-20260725' docker-compose.yml
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/procurement/ProcurementWorkspaceV13.tsx docker-compose.yml
          git commit -m 'perf(procurement): render first page before background hydration'
          git push origin HEAD:perf/procurement-fast-initial-load-v25-20260725
