name: Patch fast change-management contract

on:
  push:
    branches:
      - fix/align-fast-change-management-contract-20260801

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/align-fast-change-management-contract-20260801
          fetch-depth: 0

      - name: Align MCP contract with development-fast policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path('services/pdp_mcp/server.py')
          text = server_path.read_text(encoding='utf-8')

          replacements = {
              'description="Return the active change-management workflow. Trial deployments use development-fast mode; non-trial deployments use the standard guarded workflow.",':
                  'description="Return the active change-management workflow. While implementation is in progress, development-fast mode uses branch, CI, exact-commit deploy, short health and merge without routine approval, backup, restore verification, local snapshot or automatic rollback.",',
              '        "code_snapshot_required": True,\n        "production_changed": False,\n        "requires_github_branch": True,\n        "standard_mode_returns_when_trial_mode_is_disabled": True,':
                  '        "code_snapshot_required": not fast,\n        "restore_verification_required": not fast,\n        "automatic_rollback_enabled": not fast,\n        "approval_required": not fast,\n        "heavy_preview_gate_required": not fast,\n        "health_profile": "short" if fast else "layered",\n        "emergency_recovery": (\n            "redeploy_previous_commit_from_github"\n            if fast\n            else "verified_backup_and_code_snapshot"\n        ),\n        "production_changed": False,\n        "requires_github_branch": True,\n        "standard_mode_returns_when_trial_mode_is_disabled": True,\n        "standard_mode_requires_explicit_implementation_completion": True,',
              'description="Return the Preview gate requirements. It does not deploy or modify the Windows installation.",':
                  'description="Return an exact-commit reference. In development-fast mode this is lightweight metadata only; the heavy Preview gate is reserved for standard mode.",',
              '        "preview_created_by": "GitHub/Sites workflow",\n        "database_backup_required": not fast,':
                  '        "preview_created_by": "GitHub/Sites workflow",\n        "database_backup_required": not fast,\n        "restore_verification_required": not fast,\n        "code_snapshot_required": not fast,\n        "automatic_rollback_enabled": not fast,\n        "heavy_preview_gate_required": not fast,',
              'description="Record explicit user approval for one exact previewed commit. This does not deploy; approval expires after 24 hours.",':
                  'description="Record explicit approval for standard-mode deployment. Development-fast deployment uses standing owner authorization and does not require this per commit.",',
              'description="Ask the local agent to create and isolate-restore-verify a final backup tied to an approved commit. No deployment occurs.",':
                  'description="Create and isolate-restore-verify a final backup for standard mode or a commit explicitly marked as a destructive or sensitive database change.",',
              'description="Ask the local agent to re-run integrity and isolated restore verification for a named backup.",':
                  'description="Re-run integrity and isolated restore verification for a named backup used by standard mode or a sensitive database change.",',
              'description="Deploy only an exact, previously previewed and explicitly approved commit. The agent enforces a fresh verified final backup, health checks, locking, audit, and automatic rollback.",':
                  'description="Deploy one exact commit. Development-fast mode uses standing authorization, no routine database backup, no restore verification, no local code snapshot and no automatic rollback; standard mode retains the full guarded workflow.",',
              'description="Ask the local agent to run the layered post-deployment health check.",':
                  'description="Run post-deployment health. Development-fast mode uses a short health profile; standard mode may use the full layered profile.",',
              'description="Roll back the latest matching deployment to its verified final backup and prior code snapshot. Requires user confirmation in the client.",':
                  'description="Run the standard-mode backup-and-snapshot rollback when explicitly requested. Development-fast recovery redeploys the previous GitHub commit instead.",',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected server.py text: {old[:120]}')
              text = text.replace(old, new, 1)

          server_path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/windows/tests/Test-WindowsPowerShell51.ps1')
          test = test_path.read_text(encoding='utf-8')
          anchor = "    $phasePath = Join-Path $repositoryRoot 'release\\implementation-in-progress.json'\n"
          insert = anchor + "    $mcpServer = [IO.File]::ReadAllText((Join-Path $repositoryRoot 'services\\pdp_mcp\\server.py'))\n"
          if anchor not in test:
              raise SystemExit('Missing PowerShell test anchor')
          test = test.replace(anchor, insert, 1)

          assertion_anchor = "    Assert-True ($fastDeployment -notmatch 'Rollback-PDPOne\\.ps1') 'Fast deployment still performs automatic rollback.'\n"
          assertions = assertion_anchor + "    Assert-True ($mcpServer -match '\"code_snapshot_required\": not fast') 'MCP contract still requires a local snapshot in fast mode.'\n    Assert-True ($mcpServer -match '\"restore_verification_required\": not fast') 'MCP contract does not report restore verification as disabled in fast mode.'\n    Assert-True ($mcpServer -match '\"automatic_rollback_enabled\": not fast') 'MCP contract still reports automatic rollback in fast mode.'\n    Assert-True ($mcpServer -match '\"approval_required\": not fast') 'MCP contract still reports per-deploy approval in fast mode.'\n    Assert-True ($mcpServer -match '\"heavy_preview_gate_required\": not fast') 'MCP contract still reports a heavy Preview gate in fast mode.'\n    Assert-True ($mcpServer -match 'redeploy_previous_commit_from_github') 'MCP contract does not report GitHub redeploy recovery.'\n"
          if assertion_anchor not in test:
              raise SystemExit('Missing PowerShell assertion anchor')
          test = test.replace(assertion_anchor, assertions, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Commit patched contract
        shell: bash
        run: |
          rm -f .github/workflows/patch-fast-change-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pdp_mcp/server.py scripts/windows/tests/Test-WindowsPowerShell51.ps1 .github/workflows/patch-fast-change-contract.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align fast change-management tool contract"
          git push origin HEAD:fix/align-fast-change-management-contract-20260801
