name: Patch structural disk guard

on:
  push:
    branches:
      - feature/full-pending-procurement-analysis-issue-43
    paths:
      - .github/workflows/patch-structural-disk-guard.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-pending-procurement-analysis-issue-43
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply structural disk guard patch
        run: python .github/patch_structural_disk_guard.py
      - name: Remove one-time patch files
        run: rm -f .github/patch_structural_disk_guard.py .github/workflows/patch-structural-disk-guard.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate structural PDP One disk guard"
          git push origin HEAD:feature/full-pending-procurement-analysis-issue-43
