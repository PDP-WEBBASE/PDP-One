name: Apply procurement import PostgreSQL hotfix

on:
  push:
    branches:
      - fix/procurement-import-transaction-schema
    paths:
      - .github/workflows/apply-procurement-import-postgres-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/procurement-import-transaction-schema
          fetch-depth: 0

      - name: Apply PostgreSQL-safe row locking fix
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("backend/procurement/analysis_run_service.py")
          service = service_path.read_text(encoding="utf-8")
          replacements = {
              'ProcurementAnalysisRun.objects.select_for_update().select_related("context_snapshot", "analysis_request").get(pk=run_id)':
                  'ProcurementAnalysisRun.objects.select_for_update().select_related("context_snapshot").get(pk=run_id)',
              'ProcurementAnalysisRun.objects.select_for_update().select_related("analysis_request").get(pk=run.pk)':
                  'ProcurementAnalysisRun.objects.select_for_update().get(pk=run.pk)',
          }
          for old, new in replacements.items():
              if old not in service:
                  raise SystemExit(f"Expected locking expression not found: {old}")
              service = service.replace(old, new, 1)
          service_path.write_text(service, encoding="utf-8")

          view_path = Path("backend/procurement/views_analysis_runs.py")
          view = view_path.read_text(encoding="utf-8")
          old_detail = '"detail": f"{type(exc).__name__}: {str(exc)[:300]}",'
          new_detail = '"detail": "خطای داخلی ورود نتایج تحلیل ثبت شد؛ شناسه Run را برای بررسی نگه دارید.",'
          if old_detail not in view:
              raise SystemExit("Expected diagnostic detail expression not found")
          view = view.replace(old_detail, new_detail, 1)
          view_path.write_text(view, encoding="utf-8")

          test_path = Path("backend/procurement/tests/test_analysis_import_postgres_lock_contract.py")
          test_path.write_text(
              '''from __future__ import annotations\n\nimport inspect\n\nfrom django.test import SimpleTestCase\n\nfrom procurement.analysis_run_service import finalize_run_if_exhausted, import_result_records\n\n\nclass ProcurementImportPostgresLockContractTests(SimpleTestCase):\n    def test_locked_run_queries_do_not_join_nullable_analysis_request(self):\n        source = inspect.getsource(import_result_records) + inspect.getsource(finalize_run_if_exhausted)\n        self.assertNotIn(\n            '.select_related("context_snapshot", "analysis_request")',\n            source,\n        )\n        self.assertNotIn('.select_related("analysis_request")', source)\n''',
              encoding="utf-8",
          )

      - name: Remove one-time workflow and commit hotfix
        shell: bash
        run: |
          rm .github/workflows/apply-procurement-import-postgres-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/procurement/analysis_run_service.py backend/procurement/views_analysis_runs.py backend/procurement/tests/test_analysis_import_postgres_lock_contract.py .github/workflows/apply-procurement-import-postgres-hotfix.yml
          git commit -m "Fix PostgreSQL locking in procurement result import"
          git push origin HEAD:fix/procurement-import-transaction-schema
