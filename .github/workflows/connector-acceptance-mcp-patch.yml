name: Apply connector acceptance MCP patch

on:
  push:
    branches:
      - fix/connector-acceptance-watchdog-20260725
    paths:
      - scripts/ci/apply_connector_acceptance_mcp_patch.py
      - .github/workflows/connector-acceptance-mcp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip connector patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connector-acceptance-watchdog-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MCP patch
        run: python scripts/ci/apply_connector_acceptance_mcp_patch.py
      - name: Commit patched MCP server
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pdp_mcp/server.py
          git commit -m "Add connector acceptance MCP tools [skip connector patch]"
          git push
