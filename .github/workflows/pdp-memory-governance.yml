name: PDP One Application Boundary Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep this job name stable because the main-branch ruleset requires it.
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate application/control repository boundary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/pdp-changed-files.txt
          echo "Changed files:"
          cat /tmp/pdp-changed-files.txt

          python - <<'PY'
          from pathlib import Path

          changed = [line.strip() for line in Path('/tmp/pdp-changed-files.txt').read_text(encoding='utf-8').splitlines() if line.strip()]

          # Canonical Project Memory is private. No application PR may modify it.
          memory_changes = [p for p in changed if p.startswith('docs/project-memory/')]
          if memory_changes:
              raise SystemExit(
                  'Canonical Project Memory is maintained in the private control repository. '
                  'Application PRs must not modify docs/project-memory/**.'
              )

          forbidden_exact = {
              '.env',
              '.env.local',
              '.env.production',
              '.env.development',
              'id_rsa',
              'id_ed25519',
          }
          forbidden_suffixes = ('.pem', '.p12', '.pfx', '.key', '.pdpone')
          sensitive_paths = []
          for path in changed:
              name = Path(path).name.lower()
              if path in forbidden_exact or name in forbidden_exact or name.endswith(forbidden_suffixes):
                  sensitive_paths.append(path)
          if sensitive_paths:
              raise SystemExit('Sensitive/private file types must not be committed to the application repository: ' + ', '.join(sensitive_paths))

          # Construct forbidden identifiers so this validator does not flag its own source text.
          private_control_identifier = 'PDP-One-' + 'Control'
          forbidden_event = 'pull_request' + '_target:'

          # Application workflows must never be wired directly to the private control repository.
          for workflow in Path('.github/workflows').glob('*.y*ml'):
              text = workflow.read_text(encoding='utf-8')
              if private_control_identifier in text:
                  raise SystemExit(f'{workflow}: application workflow must not reference the private control repository')
              if forbidden_event in text:
                  raise SystemExit(f'{workflow}: pull_request_target is not allowed in PDP One application workflows')

          print('Application/control repository boundary PASS')
          PY

      - name: Validate visibility-safe PR metadata
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body="${PR_BODY:-}"
          if grep -Eiq '(PDP_MCP_TOKEN|PDP_MCP_PATH_TOKEN|POSTGRES_PASSWORD|DJANGO_SECRET_KEY|PDP_DEPLOYMENT_AGENT_SIGNING_KEY|Authorization:[[:space:]]*Bearer)' <<<"$body"; then
            echo "ERROR: PR body appears to contain private credential/configuration material."
            exit 1
          fi
          echo "Visibility-safe PR metadata PASS"

      - name: Boundary summary
        shell: bash
        run: |
          echo "Canonical internal memory and acceptance evidence are maintained outside the application repository."
          echo "Application-repository content must remain safe for future Public exposure in both Public and Private visibility modes."
          echo "Exact CI/build/deployment acceptance is coordinated through the private PDP One control plane."
