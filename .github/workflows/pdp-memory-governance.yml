name: PDP One Memory Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  memory-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical memory machine files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          json_files = [
              Path('docs/project-memory/MANIFEST.json'),
              Path('docs/project-memory/CURRENT_STATE.json'),
              Path('docs/project-memory/sources/SOURCE_CATALOG.json'),
              Path('docs/project-memory/automations/AUTOMATION_REGISTRY.json'),
              Path('docs/project-memory/company-knowledge/COMPANY_PROFILE.json'),
          ]
          for path in json_files:
              with path.open('r', encoding='utf-8') as fh:
                  json.load(fh)
              print(f'JSON PASS: {path}')

          coverage = Path('docs/project-memory/sources/TRANSFER_V10_COVERAGE_MATRIX.csv')
          with coverage.open('r', encoding='utf-8', newline='') as fh:
              rows = list(csv.DictReader(fh))
          if len(rows) != 69:
              raise SystemExit(f'Coverage matrix must contain exactly 69 source rows, found {len(rows)}')
          if any(row.get('qa_status') != 'PASS' for row in rows):
              raise SystemExit('Coverage matrix contains non-PASS source rows')
          if len({row['source_path'] for row in rows}) != 69:
              raise SystemExit('Coverage matrix contains duplicate source_path entries')
          print('Transfer v10 coverage PASS: 69/69 unique source rows')
          PY

      - name: Validate PDP project-memory linkage
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/pdp-changed-files.txt
          echo "Changed files:"
          cat /tmp/pdp-changed-files.txt

          governance_only=true
          while IFS= read -r path; do
            case "$path" in
              PDP-ONE-START-HERE.md|docs/project-memory/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|.github/workflows/pdp-memory-governance.yml)
                ;;
              *)
                governance_only=false
                ;;
            esac
          done < /tmp/pdp-changed-files.txt

          if [[ "$governance_only" == "true" ]]; then
            echo "Governance/documentation-only PR: memory linkage gate PASS."
            exit 0
          fi

          body="${PR_BODY:-}"
          if ! grep -Eiq 'PDP Session:[[:space:]]*[^[:space:]]+' <<<"$body"; then
            echo "ERROR: code/runtime PR must identify a PDP Session in the PR body."
            exit 1
          fi
          if ! grep -Eiq 'Active-work Issue:[[:space:]]*[^[:space:]]+' <<<"$body"; then
            echo "ERROR: code/runtime PR must identify its active-work/session Issue."
            exit 1
          fi
          if ! grep -Eiq 'Memory update included:[[:space:]]*(yes|no|n/a)' <<<"$body"; then
            echo "ERROR: PR body must declare Memory update included: yes/no/N/A."
            exit 1
          fi

          if ! grep -Eq '^docs/project-memory/|^PDP-ONE-START-HERE.md$' /tmp/pdp-changed-files.txt; then
            echo "ERROR: code/runtime PR must include a Project Memory update, or be split/reframed through an explicitly governed exception."
            exit 1
          fi

          echo "PDP Project Memory linkage PASS."

  connector-readable-gates:
    needs: memory-governance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEMORY_RESULT: ${{ needs.memory-governance.result }}
    steps:
      - name: Mirror exact-head gates to standard commit statuses
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const memorySuccess = process.env.MEMORY_RESULT === 'success';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state: memorySuccess ? 'success' : 'failure',
              context: 'pdp-memory',
              description: `PDP One Memory Governance: ${process.env.MEMORY_RESULT}`.slice(0, 140),
            });

            const required = [
              { workflow: 'PDP One CI', context: 'pdp-one-ci' },
              { workflow: 'Build immutable PDP One images', context: 'pdp-images' },
            ];
            for (const gate of required) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'pending',
                context: gate.context,
                description: `Waiting for ${gate.workflow}`.slice(0, 140),
              });
            }

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let selected = new Map();
            for (let attempt = 0; attempt < 160; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: sha,
                event: 'pull_request',
                per_page: 100,
              });
              selected = new Map();
              for (const gate of required) {
                const candidates = response.data.workflow_runs
                  .filter((run) => run.name === gate.workflow && run.head_sha === sha)
                  .sort((a, b) => b.id - a.id);
                if (candidates.length > 0) selected.set(gate.workflow, candidates[0]);
              }
              const allCompleted = required.every((gate) => {
                const run = selected.get(gate.workflow);
                return run && run.status === 'completed';
              });
              if (allCompleted) break;
              await sleep(15000);
            }

            let failed = !memorySuccess;
            for (const gate of required) {
              const run = selected.get(gate.workflow);
              const success = Boolean(run && run.status === 'completed' && run.conclusion === 'success');
              if (!success) failed = true;
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: success ? 'success' : 'failure',
                context: gate.context,
                description: `${gate.workflow}: ${run ? `${run.status}/${run.conclusion || 'none'}` : 'not-found'}`.slice(0, 140),
                target_url: run?.html_url,
              });
            }

            if (failed) {
              core.setFailed('One or more required exact-head PDP One workflow gates did not complete successfully.');
            }
