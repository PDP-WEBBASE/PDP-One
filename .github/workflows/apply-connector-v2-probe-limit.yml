name: Apply connector V2 probe limit

on:
  push:
    branches:
      - feature/connector-real-acceptance-20260725
    paths:
      - .github/workflows/apply-connector-v2-probe-limit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connector-real-acceptance-20260725
      - name: Apply configurable detail probe limit and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          task_path = Path('backend/procurement/tasks_connector_acceptance_v2.py')
          text = task_path.read_text(encoding='utf-8')
          helper_anchor = '''def _detail_probe(run, connector, *, limit=2):\n'''
          helper = '''def _requested_detail_probe_limit(request_payload):\n    value = int(request_payload.get("detail_probe_limit", 2))\n    return max(0, min(value, 2))\n\n\ndef _detail_probe(run, connector, *, limit=2):\n'''
          if helper_anchor not in text:
              raise SystemExit('detail probe helper anchor not found')
          text = text.replace(helper_anchor, helper, 1)
          old_call = '''            connector_report["detail_probes"] = _detail_probe(run, connector, limit=2)\n'''
          new_call = '''            connector_report["detail_probes"] = _detail_probe(\n                run,\n                connector,\n                limit=_requested_detail_probe_limit(request_payload),\n            )\n'''
          if old_call not in text:
              raise SystemExit('detail probe call anchor not found')
          task_path.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')

          test_path = Path('backend/procurement/tests/test_connector_acceptance_v2.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'from procurement.tasks_connector_acceptance_v2 import _compact_connector, _totals\n',
              'from procurement.tasks_connector_acceptance_v2 import (\n    _compact_connector,\n    _requested_detail_probe_limit,\n    _totals,\n)\n',
              1,
          )
          if 'test_requested_detail_probe_limit_can_disable_probes' not in test_text:
              test_text = test_text.replace(
                  'class ConnectorAcceptanceV2Tests(SimpleTestCase):\n',
                  '''class ConnectorAcceptanceV2Tests(SimpleTestCase):\n    def test_requested_detail_probe_limit_can_disable_probes(self):\n        self.assertEqual(_requested_detail_probe_limit({"detail_probe_limit": 0}), 0)\n        self.assertEqual(_requested_detail_probe_limit({"detail_probe_limit": 8}), 2)\n        self.assertEqual(_requested_detail_probe_limit({}), 2)\n\n''',
                  1,
              )
          test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Commit probe-limit support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/procurement/tasks_connector_acceptance_v2.py backend/procurement/tests/test_connector_acceptance_v2.py
          git commit -m "Honor configured connector detail probe limits"
          git push origin HEAD:feature/connector-real-acceptance-20260725
