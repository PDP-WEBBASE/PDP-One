name: pdp-one

x-pdp-logging: &pdp-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${PDP_DOCKER_REGISTRY:-docker.arvancloud.ir/library}/postgres:17-alpine
    restart: unless-stopped
    logging: *pdp-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdp_one}
      POSTGRES_USER: ${POSTGRES_USER:-pdp_one}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdp_one} -d ${POSTGRES_DB:-pdp_one}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: ${PDP_DOCKER_REGISTRY:-docker.arvancloud.ir/library}/redis:7-alpine
    restart: unless-stopped
    logging: *pdp-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    image: ${PDP_BACKEND_IMAGE:-pdp-one-backend:local}
    restart: unless-stopped
    logging: *pdp-logging
    env_file: .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - private_files:/data/private
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${PDP_BACKEND_IMAGE:-pdp-one-backend:local}
    restart: unless-stopped
    logging: *pdp-logging
    env_file: .env
    command: celery -A config worker -l INFO
    volumes:
      - private_files:/data/private
    depends_on: [backend, redis]

  beat:
    image: ${PDP_BACKEND_IMAGE:-pdp-one-backend:local}
    restart: unless-stopped
    logging: *pdp-logging
    env_file: .env
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on: [backend, redis]

  mcp:
    image: ${PDP_MCP_IMAGE:-pdp-one-mcp:local}
    restart: unless-stopped
    logging: *pdp-logging
    env_file: .env
    environment:
      PDP_API_URL: http://backend:8000/api/v1
      PDP_DEPLOYMENT_QUEUE: /deployment-agent/queue
    volumes:
      - "${PDP_DEPLOYMENT_AGENT_ROOT:-C:/ProgramData/PDP-One/deployment-agent}/queue/incoming:/deployment-agent/queue/incoming"
      - "${PDP_DEPLOYMENT_AGENT_ROOT:-C:/ProgramData/PDP-One/deployment-agent}/queue/responses:/deployment-agent/queue/responses:ro"
    depends_on: [backend]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=4); raise SystemExit(0 if r.status == 200 and b'pdp-one-mcp' in r.read(512) else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  web:
    image: ${PDP_WEB_IMAGE:-pdp-one-web:local}
    restart: unless-stopped
    logging: *pdp-logging
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/app/public/pdp-build.json','utf8')); process.exit(typeof x.build_id==='string'&&x.build_id.length>0?0:1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  nginx:
    image: ${PDP_DOCKER_REGISTRY:-docker.arvancloud.ir/library}/nginx:1.27-alpine
    restart: unless-stopped
    logging: *pdp-logging
    environment:
      PDP_MCP_PATH_TOKEN: ${PDP_MCP_PATH_TOKEN:-trial-path-not-configured}
      NGINX_ENVSUBST_FILTER: PDP_MCP_PATH_TOKEN
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_started
      mcp:
        condition: service_healthy

  tailscale:
    profiles: ["tunnel"]
    image: ${PDP_TAILSCALE_IMAGE:-docker.arvancloud.ir/tailscale/tailscale:stable}
    restart: unless-stopped
    logging: *pdp-logging
    network_mode: "service:nginx"
    entrypoint: ["/usr/local/bin/tailscaled"]
    command:
      - "--state=/var/lib/tailscale/tailscaled.state"
      - "--socket=/tmp/tailscaled.sock"
      - "--tun=userspace-networking"
    volumes:
      - tailscale_state:/var/lib/tailscale
    depends_on:
      nginx:
        condition: service_started
    post_start:
      - command:
          - /bin/sh
          - -ec
          - |
            sentinel=/var/lib/tailscale/pdp-funnel-dns-bootstrap-v1.done
            if [ -f "$$sentinel" ]; then
              exit 0
            fi
            attempt=0
            until tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1; do
              attempt=$$((attempt + 1))
              if [ "$$attempt" -ge 30 ]; then
                echo "tailscaled did not become ready for bounded Funnel bootstrap repair" >&2
                exit 1
              fi
              sleep 2
            done
            tailscale --socket=/tmp/tailscaled.sock funnel reset >/dev/null 2>&1 || true
            tailscale --socket=/tmp/tailscaled.sock funnel --bg --yes 80 >/dev/null
            touch "$$sentinel"

volumes:
  postgres_data:
  redis_data:
  private_files:
  tailscale_state:
