name: pdp-one

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdp_one}
      POSTGRES_USER: ${POSTGRES_USER:-pdp_one}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdp_one} -d ${POSTGRES_DB:-pdp_one}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - private_files:/data/private
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l INFO
    volumes:
      - private_files:/data/private
    depends_on: [backend, redis]

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on: [backend, redis]

  mcp:
    build:
      context: ./services/pdp_mcp
    restart: unless-stopped
    env_file: .env
    environment:
      PDP_API_URL: http://backend:8000/api/v1
    depends_on: [backend]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, backend, mcp]

volumes:
  postgres_data:
  redis_data:
  private_files:
